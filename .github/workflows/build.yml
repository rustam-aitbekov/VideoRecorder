name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore VideoRecorder.sln

      - name: Build
        run: dotnet build VideoRecorder.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test VideoRecorder.sln --configuration Release --no-build

      - name: Pack
        run: dotnet pack VideoRecorder/VideoRecorder.csproj --configuration Release --no-build --output artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/*.nupkg
